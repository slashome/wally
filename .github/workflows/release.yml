name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Build a universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/wally \
            target/aarch64-apple-darwin/release/wally \
            target/x86_64-apple-darwin/release/wally
          tar -czf "dist/wally-${GITHUB_REF_NAME}-universal-apple-darwin.tar.gz" -C dist wally

      - name: Bundle the menu bar app
        run: |
          app/scripts/bundle.sh --zip "${GITHUB_REF_NAME}"
          cp app/build/Wally-*.zip dist/

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Wally ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/wally-*.tar.gz \
            dist/Wally-*.zip
